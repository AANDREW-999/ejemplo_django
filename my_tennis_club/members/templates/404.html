{% extends "master.html" %}
{% block title %}404 - Página no encontrada{% endblock %}

{% block content %}
  <div style="text-align:center;padding:2.5rem 1.5rem;">
    <h1 style="font-size:3rem;margin:0 0 1rem;letter-spacing:.05em;color:var(--gold);">404</h1>
    <p style="margin:0 0 1.25rem;">La página solicitada{% if request_path %} <code style="background:rgba(0,0,0,.35);padding:.2rem .45rem;border-radius:4px;border:1px solid rgba(255,255,255,.15);">{{ request_path }}</code>{% endif %} no existe.</p>
    <a href="{% url 'main' %}" style="display:inline-block;background:linear-gradient(135deg,var(--grana),var(--blau));color:#fff;text-decoration:none;padding:.8rem 1.4rem;border-radius:6px;font-weight:600;border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.4);">
      Volver al inicio
    </a>
  </div>
{% endblock %}
