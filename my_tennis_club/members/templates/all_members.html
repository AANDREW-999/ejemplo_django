{% extends "master.html" %}

{% block title %}Miembros del Club{% endblock %}

{% block content %}
  <h1>Miembros</h1>
  <ul>
    {% for x in mymembers %}
      <li><a href="{% url 'details' x.id %}">{{ x.firstname }} {{ x.lastname }}</a></li>
    {% empty %}
      <li>No hay miembros registrados.</li>
    {% endfor %}
    <div style="text-align:center;">
    <span class="motto motto-large"><span class="motto-text">MÉS QUE UN CLUB.</span> <span class="emoji-group" aria-label="Emojis del club">❤️💙🏆✨</span></span>
  </div>
  </ul>
{% endblock %}
